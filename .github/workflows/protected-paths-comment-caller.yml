# Central-linter self-guard: call the reusable comment workflow.
#
# This caller demonstrates how central-linter dogfoods its own protected-paths
# guard. Consumer repos should use the example workflows in .github/examples/consumer/
# instead of copying the reusable workflow files.

name: Protected Paths (comment)

on:
  workflow_run:
    workflows: ["Protected Paths (detect)"]
    types: [completed]

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/protected-paths-comment.yml
    permissions:
      contents: read
      actions: read        # required: reusable comment workflow downloads the detect artifact via run-id
      pull-requests: write
    with:
      run-id: ${{ github.event.workflow_run.id }}
      config: .github/protected-paths.yml
      detect-workflow-path: .github/workflows/protected-paths-detect-caller.yml
      # workflow_run workflows execute from the default branch; github.sha is immutable.
      central-ref: ${{ github.sha }}
