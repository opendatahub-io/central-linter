# Central-linter self-guard: call the reusable comment workflow.
#
# This caller demonstrates how central-linter dogfoods its own protected-paths
# guard. Consumer repos should use the example workflows in .github/examples/consumer/
# instead of copying the reusable workflow files.

name: Protected Paths (comment)

on:
  workflow_run:
    workflows: ["Protected Paths (detect)"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    uses: ./.github/workflows/protected-paths-comment.yml
    with:
      run-id: ${{ github.event.workflow_run.id }}
      central-ref: ${{ github.ref }}
    secrets: inherit
