repos:
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4
    hooks:
      - id: ruff

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 5fb1699087337bc659807a9dba856a1926463229
    hooks:
      - id: renovate-config-validator
        # Use the Node already present in the environment (the central-linter
        # image ships Red Hat's Node 22) instead of downloading a third-party
        # binary via nodeenv (RHAI-19797).
        language_version: system
