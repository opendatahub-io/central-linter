# The central-linter image is based on ubi10/nodejs-22: Node comes from a
# Red Hat-built image instead of being downloaded by nodeenv at hook-install
# time (RHAI-19797). The .pre-commit-config.yaml renovate hook uses
# language_version: system to pick it up.
image: quay.io/aipcc-cicd/central-linter:v0.4.2

default:
  tags:
    - aipcc

variables:
  RES_REPO: "github.com/opendatahub-io/central-linter.git"
  RES_VERSION: "v0.4.2"
  INSTALL_RES: "pip install git+https://$RES_REPO@$RES_VERSION"

stages:
  - checks

.jira-ticket-linter:
  stage: checks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - $INSTALL_RES
    - git config --global --add safe.directory $CI_PROJECT_DIR
  script:
    - jira_ticket_linter.py

.linters:
  stage: checks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - $INSTALL_RES
    - git config --global --add safe.directory $CI_PROJECT_DIR
  script:
    - copy_linter_config.py
    - pre-commit run --all-files --verbose
