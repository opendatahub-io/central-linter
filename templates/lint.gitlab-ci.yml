# Lint jobs run in the central-linter container: every linter is preinstalled
# at a pinned version, so jobs download nothing at run time (RHAI-19797,
# RHAI-21300). The .linters job uses the image's make targets instead of
# pre-commit, which cloned hook repositories and installed toolchains from
# PyPI/npm on every run.
image: quay.io/aipcc-cicd/central-linter:v0.4.2

default:
  tags:
    - aipcc

variables:
  RES_REPO: "github.com/opendatahub-io/central-linter.git"
  RES_VERSION: "v0.4.2"
  INSTALL_RES: "pip install git+https://$RES_REPO@$RES_VERSION"

stages:
  - checks

.jira-ticket-linter:
  stage: checks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - $INSTALL_RES
    - git config --global --add safe.directory $CI_PROJECT_DIR
  script:
    - jira_ticket_linter.py

.linters:
  stage: checks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
  script:
    - make -f $HOME/Makefile linter-ruff-check linter-yamllint linter-renovate linter-shellcheck linter-markdownlint
