# Protected-paths guard -- COMMENT stage (privileged, reusable).
#
# Deterministic, no-AI supply-chain visibility layer (AIPCC-18022).
#
# REUSABLE WORKFLOW (workflow_call only): This can be called from consumer repos.
# When called, it MUST obtain central-linter's comment script from the specified ref.
#
# SECURITY MODEL: runs privileged (has base-repo context, write token, secrets).
# It validates the artifact's identity against the originating workflow_run and
# PR, then recomputes matches using trusted code and the config at the PR's base
# SHA. Artifact contents are untrusted; their matches are never used directly.
# It never executes PR-provided code.
#
# This stage posts an informational comment only. It does NOT set a failing
# status -- CODEOWNERS + branch protection remain the enforcement gate.

on:
  workflow_call:
    inputs:
      run-id:
        description: "The workflow_run id containing the sanitized artifact"
        type: string
        required: true
      config:
        description: "Path to the protected-paths config in the consumer repo"
        type: string
        default: ".github/protected-paths.yml"
      detect-workflow-path:
        description: "Expected path of the workflow that produced the artifact"
        type: string
        required: true
      central-ref:
        description: "Full commit SHA of the trusted central-linter scripts"
        type: string
        required: true
    secrets:
      token:
        description: "GitHub token for artifact download (optional; defaults to github.token)"
        required: false

jobs:
  comment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read        # required: download-artifact reads the detect run's artifact via run-id
      pull-requests: write
    steps:
      - name: Validate trusted script SHA
        env:
          CENTRAL_REF: ${{ inputs.central-ref }}
        run: |
          if [[ ! "$CENTRAL_REF" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "central-ref must be a full commit SHA." >&2
            exit 1
          fi

      # Fetch central-linter comment script from the specified ref into a subdirectory.
      - name: Checkout central-linter scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: opendatahub-io/central-linter
          ref: ${{ inputs.central-ref }}
          path: _central-linter
          persist-credentials: false

      - name: Download detector artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: protected-paths-result
          path: ${{ runner.temp }}/result
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.token || github.token }}

      - name: Validate provenance, recompute matches, and update guard comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT_FILE: ${{ runner.temp }}/result/protected-paths-result.json
          EVENT_FILE: ${{ github.event_path }}
          RUN_ID: ${{ inputs.run-id }}
          EXPECTED_DETECT_WORKFLOW_PATH: ${{ inputs.detect-workflow-path }}
          CONFIG_PATH: ${{ inputs.config }}
          CONFIG_FILE: ${{ runner.temp }}/protected-paths.yml
          RUNNER_TEMP: ${{ runner.temp }}
          CENTRAL_LINTER_PATH: _central-linter
        run: "${CENTRAL_LINTER_PATH}/.github/scripts/protected-paths-comment.sh"
